<!DOCTYPE html>
<html>
    <head>
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#da532c">
        <meta name="theme-color" content="#ffffff">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.4.0/xterm.js"
            integrity="sha512-a1TxekVOakgPoY7Z2SbpYAMhA6ZnhRGsczeVJLZPrleMzRcK84GnVo0JOPg/BVCNerWlZLPt4cEMKP8GDyfyxA=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <style>
            :root {
                --green: #20c20e;
                --black: #141414;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            body {
                background: var(--black);
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow: hidden;
                height: 100vh;
            }

            #term-wrapper {
                flex: 1;
                width: 100%;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #term-container {
                flex-shrink: 0;
                overflow: hidden;
                position: relative;
                transform-origin: center center;
            }

            #footer {
                flex-shrink: 0;
                font-family: monospace;
                font-size: 16px;
                color: var(--green);
                padding: 6px 0;
            }
            #footer a {
                color: var(--green);
                text-decoration: none;
            }
            #footer a:hover {
                text-decoration: underline;
            }

            .xterm-helpers {
                color: transparent;
            }
            .xterm-char-measure-element {
                display: hidden;
            }
            #controls {
                display: grid;
                position: absolute;
                left: 13px;
                bottom: 35px;
                grid-template-rows: repeat(3, 1fr);
                grid-template-columns: repeat(3, 1fr);
                grid-template-areas:
                    ". u ."
                    "l . r"
                    ". d .";
            }
            #up { grid-area: u; }
            #left { grid-area: l; }
            #right { grid-area: r; }
            #down { grid-area: d; }
            #controls button {
                border-radius: 50%;
                border-color: var(--green);
                background-color: #2e3436;
                color: var(--green);
                display: none;
            }
            /* Detecting mobile browsers... */
            @media (pointer:none), (pointer:coarse) {
                body {
                    overflow: scroll;
                }
                #controls {
                    width: 100px;
                    height: 100px;
                }
                #controls #up,
                #controls #down,
                #controls #left,
                #controls #right {
                    display: unset;
                }
            }
        </style>
    </head>
    <body>
        <div id="term-wrapper">
            <div id="term-container">
                <div id="terminal"></div>
                <div id="controls">
                    <button type="button" id="up">^</button>
                    <button type="button" id="down">v</button>
                    <button type="button" id="left"><</button>
                    <button type="button" id="right">></button>
                </div>
            </div>
        </div>
        <div id="footer">
            <a href="https://www.garciacalcaterra.com" target="_self">[b] back to main</a>
        </div>
        <script type="module">
            import init, * as app from "./browser.js";
            Promise.sleep = (ms) => {
                return new Promise(r => setTimeout(r, ms || 100));
            }
            const Event = Object.freeze({
                up: 1,
                down: 2,
                left: 3,
                right: 4,
            })
            let eventHandler = eventId => {
                if (!app) {
                    return console.warn("App not yet initialized");
                }
                app.event(eventId);
            }
            document.getElementById("up").addEventListener("click", () => eventHandler(Event.up));
            document.getElementById("left").addEventListener("click", () => eventHandler(Event.left));
            document.getElementById("right").addEventListener("click", () => eventHandler(Event.right));
            document.getElementById("down").addEventListener("click", () => eventHandler(Event.down));

            let canvas = document.getElementById("terminal");
            window.canvasSizeW = function () { return 120; }
            window.canvasSizeH = function () { return 40; }
            let term = new window.Terminal({
                cursorBlink: false,
                cols: canvasSizeW()+2,
                rows: canvasSizeH()+2,
                cursorInactiveStyle: "none",
                disableStdin: true,
                fontFamily: 'monospace',
                fontSize: 16,
                scrollback: 0,
                theme: {
                    selectionBackground: "transparent",
                    selectionForeground: "transparent",
                    selectionInactiveBackground: "transparent",
                    green: "#20c20e",
                    black: "#141414",
                },
            });

            term.open(canvas);
            if (!!term.textarea) {
                term.textarea.hidden = true;
            }
            window.term = term;
            term.attachCustomKeyEventHandler((ev) => {
                console.log("attachCustomKeyEventHandler", ev);
            });
            window.writeToCanvas = function (text, x, y, bold, italic) {
                term.write(`\x1B[${y+1};${x+1}H`);
                if (bold) { term.write("\x1B[1m"); }
                if (italic) { term.write("\x1b[3m"); }
                term.write(text);
                term.refresh(x, Math.min(x+1, term.rows - 1));
            }
            window.writeToTerminal = (text) => {
                term.write(text);
            }

            window.addEventListener("keydown", ev => {
                ev.stopPropagation();
                ev.stopImmediatePropagation();
                let arg = 0;
                switch (ev.key) {
                    case "ArrowUp":
                    case "k": arg = Event.up; break;
                    case "ArrowDown":
                    case "j": arg = Event.down; break;
                    case "ArrowLeft":
                    case "h": arg = Event.left; break;
                    case "Enter":
                    case "ArrowRight":
                    case "l": arg = Event.right; break;
                    case "b":
                        window.location.href = "https://www.garciacalcaterra.com";
                        return false;
                    default: break;
                }
                eventHandler(arg);
                return false;
            });

            function scaleTerminal() {
                const wrapper = document.getElementById('term-wrapper');
                const container = document.getElementById('term-container');
                const availH = wrapper.clientHeight;
                const availW = wrapper.clientWidth;
                const scaleH = availH / container.scrollHeight;
                const scaleW = availW / container.scrollWidth;
                const scale = Math.min(scaleH, scaleW, 1);
                container.style.transform = `scale(${scale})`;
            }
            window.addEventListener('resize', scaleTerminal);

            init("./browser_bg.wasm").then(async () => {
                app.run();
                app.event(1);
                scaleTerminal();
            }).catch(console.error);

        </script>
    </body>
</html>
